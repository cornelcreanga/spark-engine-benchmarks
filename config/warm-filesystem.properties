# Warm-start local-filesystem measurements; all timings exclude warming and output cleanup.
config.parent=filesystem.properties
benchmark.cacheMode=warm
benchmark.repetitions=3
benchmark.alternateOrder=true
benchmark.warmCacheTimeoutSeconds=600
benchmark.warmCacheMinResidentFraction=0.99
# Expire only snapshots produced by the current sample, preserving all older snapshots.
benchmark.discardOutputs=true
validation.enabled=false
# Existing baseline is reused, with only one sample's new output retained at a time.
local.minFreeDiskGiB=60
