# Vendor-managed runtime: do not layer Maven Iceberg jars onto this image.
config.parent=oss.properties
engine.name=quanton
engine.operator=quanton
engine.image=dist.onehouse.ai/onehouseai/quanton-spark:quanton-operator-release-v0.43.0-spark4-al2023
engine.mainApplicationFile=local:///warehouse/.sparkbench/jobs/spark-bench-jobs.jar
spark.version=4.1.0
quanton.chartVersion=2.0.7
quanton.submissionTimeoutSeconds=300
# Credential values default to ~/onehouse-values.yaml and must remain outside this project.
spark.conf.spark.driver.extraClassPath=/opt/spark/user-jars/iceberg-spark-runtime.jar:/opt/spark/user-jars/iceberg-aws-bundle.jar:/opt/spark/user-jars/iceberg-spark-quanton.jar
spark.conf.spark.executor.extraClassPath=/opt/spark/user-jars/iceberg-spark-runtime.jar:/opt/spark/user-jars/iceberg-aws-bundle.jar:/opt/spark/user-jars/iceberg-spark-quanton.jar
spark.conf.spark.quanton.accelerator=native
spark.conf.spark.quanton.clustering.accelerate=true
# Quanton splits executor.memory itself: 12g -> 4g heap + 8g native, plus 2g overhead.
spark.executor.memory=12g
spark.executor.memoryOverhead=2g
spark.conf.spark.quanton.executor.offHeapRatio=0.6666666666666666
image.sparkLine=4.1
image.icebergVersion=bundled
