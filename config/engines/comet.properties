config.parent=oss.properties
engine.name=comet
engine.image=spark-bench/comet:1.1.0-spark4.0.2-iceberg1.11.0
image.icebergVersion=1.11.0
image.mavenCoordinates=org.apache.datafusion:comet-spark-spark4.0_2.13:1.1.0
spark.conf.spark.plugins=org.apache.spark.CometPlugin
spark.conf.spark.shuffle.manager=org.apache.spark.sql.comet.execution.shuffle.CometShuffleManager
spark.conf.spark.comet.enabled=true
spark.conf.spark.comet.scan.icebergNative.enabled=true
spark.conf.spark.comet.explain.fallback.enabled=true
# Keep each full-profile executor at 14 GiB: 4 GiB heap + 8 GiB off-heap + 2 GiB overhead.
spark.executor.memory=4g
spark.conf.spark.memory.offHeap.enabled=true
spark.conf.spark.memory.offHeap.size=8g
# Iceberg native Parquet writes require both flags, independently of generic Parquet writes.
spark.conf.spark.comet.write.iceberg.splitOperator.enabled=true
spark.conf.spark.comet.iceberg.write.enabled=true
spark.conf.spark.comet.parquet.write.enabled=true
