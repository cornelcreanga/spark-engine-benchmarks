# Physical committed Parquet bytes; all events are in this UTC hour.
dataset.targetBytes=21474836480
dataset.fileBytes=10485760
dataset.sizeTolerance=0.05
dataset.maxBatches=500
dataset.hour=2026-01-01T12:00:00Z
dataset.seed=42
dataset.payloadBytes=1024
dataset.topLevelFraction=0.75
dataset.buckets=16
dataset.customers=4096
dataset.systemsPerCustomer=64
# Weight rises linearly from 1 to 3 across actual Iceberg customer buckets.
dataset.bucketSkew=3.0
# Optional exact relative bucket weights (one per bucket): dataset.bucketWeights=1,2,3,4
# Order: dnsrequest,prstart,prend,filecreated,filemodify,filerename,filedelete
dataset.eventWeights=20,15,10,15,20,10,10
dataset.partitions=40
dataset.calibrationRows=100000
dataset.maxBatchRows=5000000
catalog.name=bench
catalog.uri=http://iceberg-rest:8181
catalog.warehouse=s3://spark-bench/warehouse
catalog.namespace=events
catalog.table=machine_events_uuid_string
s3.endpoint=http://localstack:4566
s3.region=us-east-1
s3.bucket=spark-bench
# Local-only dummy credentials. External mode uses environment/SDK credentials.
s3.accessKey=test
s3.secretKey=test
k8s.namespace=spark-bench
k8s.context=minikube
k8s.minikubeProfile=minikube
k8s.imagePullPolicy=IfNotPresent
spark.version=4.0.2
spark.driver.cores=2
spark.driver.memory=4g
spark.driver.memoryOverhead=1g
spark.executor.instances=2
spark.executor.cores=3
spark.executor.memory=12g
spark.executor.memoryOverhead=2g
spark.shufflePartitions=80
spark.timeoutSeconds=14400
benchmark.repetitions=1
benchmark.compactionStrategy=sort
validation.enabled=true
compaction.target-file-size-bytes=536870912
compaction.min-input-files=3
compaction.max-file-group-size-bytes=10737418240
compaction.max-concurrent-file-group-rewrites=100
compaction.partial-progress.enabled=true
compaction.partial-progress.max-commits=10
operator.release=spark-operator
operator.namespace=spark-operator
operator.chart=spark-operator/spark-operator
operator.chartVersion=2.4.0
localstack.image=localstack/localstack:4.10.0
# The fixture publishes latest; pin a tested digest for long-lived comparisons.
catalog.image=apache/iceberg-rest-fixture:latest
results.directory=build/results

# Optional benchmark-specific packages, independent of engine definitions:
# benchmark.helm.release=compaction-deps
# benchmark.helm.chart=repo/chart
# benchmark.helm.version=1.2.3
# benchmark.helm.namespace=spark-bench
# benchmark.helm.values=config/compaction-values.yaml
# benchmark.manifest=config/compaction-packages.yaml

# Each successful compaction is independently checked before baseline restoration.
validation.trino.enabled=true
validation.trino.image=trinodb/trino:476
validation.trino.catalog=iceberg
validation.trino.pod=deployment/trino
validation.trino.server=http://localhost:8080

# Local Bash orchestrator resource budgets (MiB for memory).
local.minikube.cpus=12
local.minikube.memoryMiB=38912
local.minikube.timeoutSeconds=600
local.minFreeDiskGiB=100
local.helm.version=v3.19.0

# Allow initial registry image downloads on a cold cluster.
infrastructure.timeoutSeconds=900

# CLI shares the Trino validator pod with its server; avoid its default 1 GiB heap.
validation.trino.cliHeap=128m
validation.trino.cliJar=/usr/bin/trino
